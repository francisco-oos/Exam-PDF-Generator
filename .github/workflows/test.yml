name: Pruebas de Windows y Linux
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar librería QR redundante en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt -r requirements-omr.txt
      - name: Revisar sintaxis del frontend OMR sin conexión
        run: node --check omr_web/static/app.js
      - name: Diagnosticar dependencias de servicio OMR web
        run: python -m omr_web.doctor --json
      - name: Verificar sintaxis Python y lanzadores Linux
        if: runner.os == 'Linux'
        run: |
          python -m compileall -q omr_web
          bash -n Iniciar_OMR_Web_Linux.sh Instalar_OMR_Web_Linux.sh
      - name: Probar diagnóstico del iniciador OMR Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call Iniciar_OMR_Web_Windows.bat --verificar
      - name: Revisar sintaxis del diseñador web independiente
        run: node --check omr_web/static/designer.js
      - name: Preparar Tk y Xvfb en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Ejecutar pruebas en Linux con pantalla virtual
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -W error::pytest.PytestUnraisableExceptionWarning
      - name: Ejecutar pruebas en Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -W error::pytest.PytestUnraisableExceptionWarning
      - name: Verificar iniciador Windows sin interfaz (Python 3.13)
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: cmd
        run: |
          call Iniciar_Windows.bat --verificar
          .venv\Scripts\python.exe -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

      - name: Prueba gráfica OMR en Xvfb
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: xvfb-run -a python tests/smoke_gui.py
      - name: Preparar plantilla de ejemplo
        run: python crear_ejemplo.py
      - name: Probar el generador de 20 preguntas
        run: python generar.py --entrada ejemplos/Plantilla_20_preguntas.xlsx --salida salidas --titulo 'Evaluacion CI' --subtitulo 'Prueba automatizada'

  probar-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar UID y GID de la carpeta compartida del runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validar Compose y construir contenedor
        run: |
          docker compose config --quiet
          docker compose build
      - name: Probar interfaz local y salida CLI en contenedor
        run: |
          docker compose up -d
          for i in $(seq 1 35); do
            if curl --silent --fail http://localhost:8765/salud; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8765/ | grep -q 'Preparar evaluación'
          docker compose exec -T generador python generar.py \
            --entrada /app/ejemplos/Plantilla_20_preguntas.xlsx \
            --salida /datos/salidas \
            --titulo 'Evaluación Docker' --empresa 'Empresa de ejemplo'
          test -n "$(find datos/salidas -name Cuadernillo.pdf -print -quit)"
      - name: Registros de diagnóstico
        if: failure()
        run: docker compose logs --tail=120
      - name: Detener contenedor
        if: always()
        run: docker compose down
