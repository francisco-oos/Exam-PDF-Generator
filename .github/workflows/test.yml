name: Pruebas de Windows y Linux
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Preparar plantilla de ejemplo
        run: python crear_ejemplo.py
      - name: Probar el generador de 20 preguntas
        run: python generar.py --entrada ejemplos/Plantilla_20_preguntas.xlsx --salida salidas --titulo 'Evaluacion CI' --subtitulo 'Prueba automatizada'
